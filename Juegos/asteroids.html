<div class="game-container">
    <canvas id="board" width="700" height="560"></canvas>

    <div class="sidebar">
        <button id="start-btn" onclick="startGame()">Jugar</button>

        <div class="panel">
            <h3>Puntuación</h3>
            <p id="score">0</p>
        </div>
        <div class="panel">
            <h3>Vidas</h3>
            <p id="lives">❤️ ❤️ ❤️</p>
        </div>
        <div class="panel">
            <h3>Oleada</h3>
            <p id="wave">1</p>
        </div>

        <div class="controls">
            <kbd>↑</kbd> Acelerar<br>
            <kbd>←</kbd><kbd>→</kbd> Girar<br>
            <kbd>Espacio</kbd> Disparar<br>
            <kbd>P</kbd> Pausa
        </div>
    </div>

<script>
// ============ CONFIGURACIÓN ============
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ============ ESTADO DEL JUEGO ============
let ship, bullets, asteroids, particles, stars;
let score = 0;
let lives = 3;
let wave = 1;
let gameOver = false;
let paused = false;
let keys = {};
let animationId = null;
let invincibleTimer = 0;
let comboCount = 0;
let comboTimer = 0;

// ============ ESTRELLAS DE FONDO ============
function createStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 1.5 + 0.3,
            twinkleSpeed: Math.random() * 0.02 + 0.005,
            brightness: Math.random()
        });
    }
}

function drawStars(time) {
    stars.forEach(s => {
        s.brightness += s.twinkleSpeed;
        const alpha = 0.3 + Math.sin(s.brightness) * 0.3 + 0.2;
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
}

// ============ NAVE ============
function createShip() {
    return {
        x: W / 2,
        y: H / 2,
        angle: -Math.PI / 2,
        velocity: { x: 0, y: 0 },
        radius: 15,
        thrustPower: 0.15,
        friction: 0.98,
        rotSpeed: 0.06,
        engineFlicker: 0
    };
}

function drawShip() {
    if (!ship) return;

    // Parpadeo de invencibilidad
    const blink = invincibleTimer > 0 && Math.floor(invincibleTimer / 8) % 2 === 0;
    if (blink) return;

    const cx = ship.x;
    const cy = ship.y;
    const a = ship.angle;

    // Motor (fuego)
    if (keys['ArrowUp']) {
        ship.engineFlicker += 0.3;
        const flickerLen = 12 + Math.sin(ship.engineFlicker) * 5;
        const exhaustAngle = a + Math.PI;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(exhaustAngle);

        // Fuego exterior
        const gradient = ctx.createLinearGradient(-flickerLen, 0, -4, 0);
        gradient.addColorStop(0, 'rgba(233, 69, 96, 0)');
        gradient.addColorStop(0.5, 'rgba(255, 120, 0, 0.7)');
        gradient.addColorStop(1, 'rgba(255, 200, 0, 0.9)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(-4, -5);
        ctx.lineTo(-flickerLen, 0);
        ctx.lineTo(-4, 5);
        ctx.closePath();
        ctx.fill();

        // Núcleo del fuego
        const coreGrad = ctx.createLinearGradient(-8, 0, -3, 0);
        coreGrad.addColorStop(0, 'rgba(255, 100, 0, 0)');
        coreGrad.addColorStop(1, 'rgba(255, 255, 200, 0.9)');

        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.moveTo(-4, -3);
        ctx.lineTo(-(flickerLen * 0.5), 0);
        ctx.lineTo(-4, 3);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    } else {
        ship.engineFlicker = 0;
    }

    // Dibujar nave (triángulo)
    const noseX = cx + Math.cos(a) * 18;
    const noseY = cy + Math.sin(a) * 18;
    const leftX = cx + Math.cos(a + 2.5) * 14;
    const leftY = cy + Math.sin(a + 2.5) * 14;
    const rightX = cx + Math.cos(a - 2.5) * 14;
    const rightY = cy + Math.sin(a - 2.5) * 14;

    // Sombra / glow
    ctx.shadowColor = '#00f5ff';
    ctx.shadowBlur = 10;

    ctx.strokeStyle = '#00f5ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(noseX, noseY);
    ctx.lineTo(leftX, leftY);
    ctx.lineTo(cx, cy - 4); // línea trasera
    ctx.lineTo(rightX, rightY);
    ctx.closePath();
    ctx.stroke();

    ctx.shadowBlur = 0;

    // Centro de la nave
    ctx.fillStyle = 'rgba(0, 245, 255, 0.1)';
    ctx.fill();
}

// ============ BALAS ============
function shoot() {
    if (!ship || gameOver || paused) return;

    const speed = 8;
    bullets.push({
        x: ship.x + Math.cos(ship.angle) * 18,
        y: ship.y + Math.sin(ship.angle) * 18,
        vx: Math.cos(ship.angle) * speed + ship.velocity.x * 0.3,
        vy: Math.sin(ship.angle) * speed + ship.velocity.y * 0.3,
        life: 60,
        trail: []
    });

    // Partículas de disparo
    for (let i = 0; i < 4; i++) {
        particles.push({
            x: bullets[bullets.length - 1].x,
            y: bullets[bullets.length - 1].y,
            vx: Math.cos(ship.angle + (Math.random() - 0.5) * 0.8) * (Math.random() * 2 + 1),
            vy: Math.sin(ship.angle + (Math.random() - 0.5) * 0.8) * (Math.random() * 2 + 1),
            life: 12,
            color: '#ffff64',
            size: 2
        });
    }
}

function drawBullets() {
    bullets.forEach(b => {
        // Estela
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 8) b.trail.shift();

        for (let i = 0; i < b.trail.length - 1; i++) {
            const alpha = (i / b.trail.length) * 0.5;
            ctx.strokeStyle = `rgba(255, 255, 100, ${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(b.trail[i].x, b.trail[i].y);
            ctx.lineTo(b.trail[i + 1].x, b.trail[i + 1].y);
            ctx.stroke();
        }

        // Bala principal
        ctx.shadowColor = '#ffff00';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#ffff64';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
        ctx.fill();

        // Núcleo blanco
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
    });
}

// ============ ASTEROIDES ============
function createAsteroid(x, y, size) {
    const speeds = { big: 1.5, medium: 2.5, small: 3.5 };
    const radii = { big: 30, medium: 18, small: 10 };
    const points = [];
    const numPoints = Math.floor(Math.random() * 6) + 7;

    for (let i = 0; i < numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        const r = radii[size] * (0.7 + Math.random() * 0.3);
        points.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
    }

    return {
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * speeds[size] * 2,
        vy: (Math.random() - 0.5) * speeds[size] * 2,
        radius: radii[size],
        size: size, // 'big', 'medium', 'small'
        points: points,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.03,
        color: `hsl(${Math.floor(Math.random() * 40) + 18}, ${60 + Math.random() * 20}%, ${45 + Math.random() * 15}%)`
    };
}

function spawnWave() {
    asteroids = [];
    const count = wave + 3;
    for (let i = 0; i < count; i++) {
        let x, y;
        do {
            x = Math.random() * W;
            y = Math.random() * H;
        } while (dist(x, y, ship.x, ship.y) < 150);

        asteroids.push(createAsteroid(x, y, 'big'));
    }
}

function drawAsteroids() {
    asteroids.forEach(a => {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rotation);

        // Glow sutil
        ctx.shadowColor = '#8b7355';
        ctx.shadowBlur = 4;

        ctx.strokeStyle = a.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(a.points[0].x, a.points[0].y);
        for (let i = 1; i < a.points.length; i++) {
            ctx.lineTo(a.points[i].x, a.points[i].y);
        }
        ctx.closePath();
        ctx.stroke();

        // Relleno semi-transparente
        ctx.fillStyle = `rgba(${hexToRgb(a.color)}, 0.1)`;
        ctx.fill();

        // Cráteres / detalles
        ctx.shadowBlur = 0;
        const numCraters = Math.floor(Math.random() * 2) + 1;
        for (let c = 0; c < numCraters; c++) {
            const cx = a.points[Math.floor(a.points.length / 3)].x * 0.4;
            const cy = a.points[Math.floor(a.points.length * 2 / 3)].y * 0.4;
            ctx.strokeStyle = `rgba(0,0,0,0.3)`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(cx, cy, 3 + Math.random() * 3, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.restore();
    });
}

function hexToRgb(hex) {
    // Parse simple color string to get approximate RGB values
    return '180, 150, 120';
}

// ============ PARTÍCULAS ============
function spawnExplosion(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: Math.floor(Math.random() * 30 + 15),
            color: color || '#ff6464',
            size: Math.random() * 3 + 1
        });
    }
}

function drawParticles() {
    particles.forEach(p => {
        const alpha = p.life / 45;
        ctx.fillStyle = `rgba(255, ${parseInt(p.color.slice(-6, -3), 16) > 0 ? '200' : '100'}, ${alpha})`;
        ctx.globalAlpha = Math.min(alpha * 2, 1);
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
}

// ============ HUD COMBO & WAVE ============
function drawHUD() {
    // Combo indicator
    if (comboCount > 1 && comboTimer > 0) {
        const alpha = Math.min(comboTimer / 30, 1);
        ctx.fillStyle = `rgba(255, 200, 0, ${alpha})`;
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${comboCount}x COMBO!`, W / 2, H - 30);
    }

    // Puntuación en canvas
    ctx.fillStyle = '#eee';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`OLEADA ${wave}`, 15, 25);

    ctx.textAlign = 'right';
    const scoreText = `SCORE: ${score}`;
    if (comboCount > 1) {
        ctx.fillStyle = '#ffff00';
    } else {
        ctx.fillStyle = '#eee';
    }
    ctx.fillText(scoreText, W - 15, 25);

    // Indicador de invencibilidad
    if (invincibleTimer > 0) {
        const alpha = Math.min(invincibleTimer / 90, 1) * 0.3;
        ctx.strokeStyle = `rgba(0, 245, 255, ${alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(ship.x, ship.y, ship.radius + 8, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Texto de oleada completa
    if (asteroids.length === 0 && !gameOver) {
        ctx.fillStyle = '#e94560';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
        ctx.globalAlpha = pulse;
        ctx.fillText(`¡OLEADA ${wave} COMPLETA!`, W / 2, H / 2);
        ctx.globalAlpha = 1;
    }
}

// ============ UTILIDADES ============
function dist(x1, y1, x2, y2) {
    return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
}

function wrapPosition(obj) {
    if (obj.x < -30) obj.x = W + 30;
    if (obj.x > W + 30) obj.x = -30;
    if (obj.y < -30) obj.y = H + 30;
    if (obj.y > H + 30) obj.y = -30;
}

// ============ COLISIONES ============
function checkCollisions() {
    // Balas vs Asteroides
    for (let b = bullets.length - 1; b >= 0; b--) {
        let bulletHit = false;
        for (let a = asteroids.length - 1; a >= 0; a--) {
            if (dist(bullets[b].x, bullets[b].y, asteroids[a].x, asteroids[a].y) < asteroids[a].radius + 5) {
                // Hit!
                const asteroid = asteroids[a];

                // Partículas de explosión
                spawnExplosion(asteroid.x, asteroid.y, 12, '#ff9464');

                score += asteroid.size === 'big' ? 20 : asteroid.size === 'medium' ? 50 : 100;
                updateUI();

                // Combo timer
                comboCount++;
                comboTimer = 45;

                // Dividir asteroide
                if (asteroid.size === 'big') {
                    asteroids.push(createAsteroid(asteroid.x, asteroid.y, 'medium'));
                    asteroids.push(createAsteroid(asteroid.x, asteroid.y, 'medium'));
                } else if (asteroid.size === 'medium') {
                    asteroids.push(createAsteroid(asteroid.x, asteroid.y, 'small'));
                    asteroids.push(createAsteroid(asteroid.x, asteroid.y, 'small'));
                }

                asteroids.splice(a, 1);
                bullets.splice(b, 1);
                bulletHit = true;
                break;
            }
        }
    }

    // Nave vs Asteroides (solo si no es invencible)
    if (invincibleTimer <= 0 && ship) {
        for (let a = asteroids.length - 1; a >= 0; a--) {
            if (dist(ship.x, ship.y, asteroids[a].x, asteroids[a].y) < asteroids[a].radius + ship.radius * 0.7) {
                // Daño!
                spawnExplosion(ship.x, ship.y, 25, '#00f5ff');
                lives--;
                updateUI();

                if (lives <= 0) {
                    gameOver = true;
                } else {
                    ship.x = W / 2;
                    ship.y = H / 2;
                    ship.velocity = { x: 0, y: 0 };
                    invincibleTimer = 90;
                    comboCount = 0;
                }
                break;
            }
        }
    }

    // Siguiente oleada
    if (asteroids.length === 0 && !gameOver) {
        wave++;
        comboCount = 0;
        spawnWave();
        updateUI();
    }
}

// ============ ACTUALIZACIÓN ============
function update() {
    if (gameOver || paused) return;

    // Combo timer
    if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) comboCount = 0;
    }

    // Invencibilidad
    if (invincibleTimer > 0) invincibleTimer--;

    // Rotación de nave
    const rotSpeed = ship.rotSpeed * 1.2;
    if (keys['ArrowLeft']) ship.angle -= rotSpeed;
    if (keys['ArrowRight']) ship.angle += rotSpeed;

    // Aceleración
    if (keys['ArrowUp']) {
        ship.velocity.x += Math.cos(ship.angle) * ship.thrustPower;
        ship.velocity.y += Math.sin(ship.angle) * ship.thrustPower;

        // Partículas de motor
        if (Math.random() < 0.5) {
            particles.push({
                x: ship.x - Math.cos(ship.angle) * 14,
                y: ship.y - Math.sin(ship.angle) * 14,
                vx: -Math.cos(ship.angle + Math.PI) * (Math.random() * 2 + 0.5),
                vy: -Math.sin(ship.angle + Math.PI) * (Math.random() * 2 + 0.5),
                life: 15,
                color: '#ff6432',
                size: Math.random() * 2 + 1
            });
        }
    }

    // Fricción y movimiento
    ship.velocity.x *= ship.friction;
    ship.velocity.y *= ship.friction;
    ship.x += ship.velocity.x;
    ship.y += ship.velocity.y;
    wrapPosition(ship);

    // Actualizar balas
    for (let b = bullets.length - 1; b >= 0; b--) {
        bullets[b].x += bullets[b].vx;
        bullets[b].y += bullets[b].vy;
        bullets[b].life--;
        if (bullets[b].life <= 0) {
            spawnExplosion(bullets[b].x, bullets[b].y, 3, '#ffff64');
            bullets.splice(b, 1);
        } else {
            wrapPosition(bullets[b]);
        }
    }

    // Actualizar asteroides
    asteroids.forEach(a => {
        a.x += a.vx;
        a.y += a.vy;
        a.rotation += a.rotSpeed;
        wrapPosition(a);
    });

    // Actualizar partículas
    for (let p = particles.length - 1; p >= 0; p--) {
        particles[p].x += particles[p].vx;
        particles[p].y += particles[p].vy;
        particles[p].vx *= 0.97;
        particles[p].vy *= 0.97;
        particles[p].life--;
        if (particles[p].life <= 0) {
            particles.splice(p, 1);
        }
    }

    checkCollisions();
}

// ============ DIBUJO PRINCIPAL ============
function draw() {
    // Fondo
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Estrellas
    drawStars(Date.now());

    // Asteroides
    drawAsteroids();

    // Balas
    drawBullets();

    // Nave
    if (ship && !gameOver) {
        drawShip();
    }

    // Partículas
    drawParticles();

    // HUD
    drawHUD();

    // Game Over overlay
    if (gameOver) {
        ctx.fillStyle = 'rgba(10, 10, 26, 0.85)';
        ctx.fillRect(0, 0, W, H);

        ctx.shadowColor = '#e94560';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#e94560';
        ctx.font = 'bold 48px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 30);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#eee';
        ctx.font = '22px sans-serif';
        ctx.fillText(`Puntuación: ${score}`, W / 2, H / 2 + 15);
        ctx.fillText(`Oleada alcanzada: ${wave}`, W / 2, H / 2 + 45);

        ctx.fillStyle = '#888';
        ctx.font = '16px sans-serif';
        ctx.fillText('Pulsa JUGAR para reiniciar', W / 2, H / 2 + 80);
    }

    // Pausa
    if (paused && !gameOver) {
        ctx.fillStyle = 'rgba(10, 10, 26, 0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.shadowColor = '#e94560';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#e94560';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⏸ PAUSA', W / 2, H / 2);
    }

    // Pantalla de inicio
    if (!ship && !gameOver) {
        drawStartScreen();
    }
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(10, 10, 26, 0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.shadowColor = '#00f5ff';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#00f5ff';
    ctx.font = 'bold 42px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🚀 ASTEROIDS 🪨', W / 2, H / 2 - 60);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#eee';
    ctx.font = '18px sans-serif';
    ctx.fillText('Destruye todos los asteroides y sobrevive.', W / 2, H / 2);

    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 20px sans-serif';
    const pulse = Math.sin(Date.now() * 0.003) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.fillText('Pulsa JUGAR para comenzar', W / 2, H / 2 + 50);
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#888';
    ctx.font = '14px sans-serif';
    ctx.fillText('↑ Acelerar | ← → Girar | Espacio Disparar', W / 2, H / 2 + 90);
}

// ============ UI ============
function updateUI() {
    document.getElementById('score').textContent = score;
    let heartsStr = '';
    for (let i = 0; i < lives; i++) heartsStr += '❤️ ';
    document.getElementById('lives').textContent = heartsStr.trim();
    document.getElementById('wave').textContent = wave;
}

// ============ GAME LOOP ============
function gameLoop() {
    update();
    draw();
    animationId = requestAnimationFrame(gameLoop);
}

// ============ CONTROLES ============
document.addEventListener('keydown', (e) => {
    keys[e.key] = true;

    if (e.key === ' ' && !gameOver) {
        e.preventDefault();
        shoot();
    }

    if ((e.key === 'p' || e.key === 'P') && ship && !gameOver) {
        paused = !paused;
    }
});

document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

// ============ INICIO ============
function startGame() {
    ship = createShip();
    bullets = [];
    asteroids = [];
    particles = [];
    score = 0;
    lives = 3;
    wave = 1;
    gameOver = false;
    paused = false;
    comboCount = 0;
    comboTimer = 0;
    invincibleTimer = 60;

    createStars();
    spawnWave();
    updateUI();

    if (animationId) cancelAnimationFrame(animationId);
    gameLoop();
}

// Pantalla inicial estática
createStars();
drawStartScreen();
</script>

</body>
</html>
